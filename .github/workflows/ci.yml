name: Rust
on: [push, pull_request]
jobs:
  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test --offline --locked
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo test --offline --locked
      - run: cargo run --offline --locked --example usage
      - run: cargo tree --offline --locked
      - run: rustc --edition 2024 --crate-type lib --crate-name sunphase src/lib.rs
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo check --locked --target wasm32-unknown-unknown
