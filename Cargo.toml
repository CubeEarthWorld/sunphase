[package]
name = "sunphase"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
description = "Composable multilingual natural-language date and time parser"
repository = "https://github.com/CubeEarthWorld/sunphase"
include = ["Cargo.toml", "Cargo.lock", "src/**", "tests/**", "examples/**", "docs/**", "README*.md", "CHANGELOG.md", "LICENSE", "rust-toolchain.toml"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }

[features]
default = ["unicode-properties"]
unicode-properties = ["regex/unicode"]

[profile.release]
lto = true
codegen-units = 1
